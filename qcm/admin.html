<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Espace prof — QCM Hebdo</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="top-nav">
  <a href="index.html" class="brand"><span class="dot"></span> QCM Hebdo</a>
  <div class="nav-links">
    <a href="index.html">Accueil</a>
    <a href="stats.html">Stats</a>
    <a href="admin.html" class="active">Espace prof</a>
  </div>
</nav>

<div class="wrapper">

  <!-- Formulaire de connexion -->
  <div id="login-section" class="center-box card" style="display:none;">
    <h2>Connexion</h2>
    <p>Connecte-toi pour créer un nouveau QCM.</p>
    <div id="login-error"></div>
    <form id="login-form">
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="login-password">Mot de passe</label>
        <input type="password" id="login-password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
    </form>
  </div>

  <!-- Espace de création (visible une fois connecté) -->
  <div id="admin-section" style="display:none;">
    <div class="page-title" style="display:flex; align-items:flex-start; justify-content:space-between; gap: 16px;">
      <div>
        <h1>Nouveau <span class="accent">QCM</span></h1>
        <p>10 questions, 4 propositions chacune. Sélectionne la bonne réponse pour chaque question.</p>
      </div>
      <button id="logout-btn" class="btn btn-ghost">Se déconnecter</button>
    </div>

    <div id="admin-alert"></div>

    <div class="card" style="margin-bottom: 20px;">
      <div class="field" style="margin-bottom:0;">
        <label for="quiz-title">Titre du QCM</label>
        <input type="text" id="quiz-title" placeholder="Ex : Les fractions" />
        <p class="helper-text" id="quiz-numero-preview"></p>
      </div>
    </div>

    <div id="questions-container"></div>

    <div class="btn-row">
      <button id="submit-quiz" class="btn btn-primary">Publier le QCM</button>
    </div>
  </div>

</div>

<footer class="site-footer">QCM Hebdo — Espace prof</footer>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="js/app-admin.js"></script>
</body>
</html>
